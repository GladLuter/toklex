name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php -d memory_limit=128M php/tests/run.php

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --no-progress

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python python/tests/run.py
      - run: python python/tests/test_proxy.py

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  cross:
    name: PHP, Python and TypeScript agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tests/cross/fuzz.py 1 2000
      - run: python tests/cross/fuzz.py 2 2000

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r bench/requirements.txt
      - run: python bench/test_live.py
      - run: python bench/test_tokens.py
      - run: python bench/make_data.py
      - run: php bench/encode.php examples/stations.schema.json bench/out/enc
      - run: python bench/tokens.py

  packages:
    name: Packages carry the licence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # js/ and python/ hold copies of LICENSE and NOTICE, because a package can only ship files from its own folder
      - run: for d in js python; do cmp LICENSE $d/LICENSE; cmp NOTICE $d/NOTICE; done
      - run: pip install build && python -m build --outdir dist-py python
      - run: |
          python - <<'PY'
          import glob, tarfile, zipfile
          wheel = zipfile.ZipFile(glob.glob("dist-py/*.whl")[0]).namelist()
          sdist = tarfile.open(glob.glob("dist-py/*.tar.gz")[0]).getnames()
          for f in ("LICENSE", "NOTICE"):
              assert any(n.endswith(".dist-info/licenses/" + f) for n in wheel), (f, wheel)
              assert any(n.endswith("/" + f) for n in sdist), (f, sdist)
          PY
      - run: npm pack --dry-run --json | python -c "import json, sys; f = {x['path'] for x in json.load(sys.stdin)[0]['files']}; assert {'LICENSE', 'NOTICE'} <= f, f"
        working-directory: js
